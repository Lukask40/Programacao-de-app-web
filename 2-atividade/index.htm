<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora PI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Símbolos matemáticos passando -->
<div class="simbolo">➕</div>
<div class="simbolo">➖</div>
<div class="simbolo">✖</div>
<div class="simbolo">➗</div>
<div class="simbolo">π</div>

<!-- Container da calculadora -->
<div class="container">

    <!-- Logo SVG do π -->
    <div class="logo-pi">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="80" fill="#00f">π</text>
        </svg>
    </div>

    <h1>Calculadora</h1>

    <label>Primeiro número</label>
    <input type="number" id="numeroInput1" placeholder="Ex: 7">

    <label>Segundo número</label>
    <input type="number" id="numeroInput2" placeholder="Ex: 3">

    <button id="btnCalcular">Calcular</button>

    <div id="resultadoCalculo"></div>

</div>

<script src="script.js"></script>
</body>
</html>
