<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra de maçãs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="falling-object apple a1"></div>
    <div class="falling-object leaf l1"></div>
    <div class="falling-object green-apple ga1"></div>
    <div class="falling-object apple a2"></div>
    <div class="falling-object leaf l2"></div>
    <div class="falling-object green-apple ga2"></div>
    <div class="falling-object leaf l3"></div>
    <div class="falling-object apple a3"></div>

    <main class="main-container">
        <header>
            <img src="assets/logo5.jpg" alt="Logo da Loja de Maçãs" class="store-logo"/>
            <h1>Compra de Maçãs</h1>
            <p class="subtitle">
                Quantas maçãs fresquinhas você quer levar?
            </p>
        </header>
        <section class="form-section">
            <div class="input-group">
                <label for="quantidadeMacas">Quantidade de maçãs:</label>
                <input type="number" id="quantidadeMacas" placeholder="Ex: 5" autocomplete="off" min="1">
                <span class="input-highlight"></span>
            </div>

            <button id="btnCalcularCompra">Calcular Preço</button>
        </section>
        <footer>
            <div id="resultadoCompra"></div>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
