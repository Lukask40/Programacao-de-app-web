<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media do aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Logo -->
    <image src="assets/logo3.png" alt="Logo da empresa"/>

    <h1>Calculadora de Média do Aluno</h1>

    <label for="nome">Nome do aluno:</label>
    <input type="text" id="nome" placeholder="Ex: João Silva"><br><br>
    <label for="nota1">nota 1:</label>
    <input type="number" id="nota1" placeholder="Ex: 7.5"><br><br>

    <label for="nota2">nota 2:</label>
    <input type="number" id="nota2" placeholder="Ex: 8.0"><br><br>

    <label for="nota3">nota 3:</label>
    <input type="number" id="nota3" placeholder="Ex: 6.5"><br><br>

    <div class="simbolo-matematico s1">+</div>
<div class="simbolo-matematico s2">-</div>
<div class="simbolo-matematico s3">x</div>
<div class="simbolo-matematico s4">÷</div>
<div class="simbolo-matematico s5">%</div>

    <button id="btnCalcularMedia">Calcular Média</button>

    <div id="resultadoMedia"></div>

    <script src="script.js"></script>
    
</body>
</html>
