<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regras de votação - Polícia Uchiha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="moving-object fan u1"></div>
    <div class="moving-object shuriken s1"></div>
    <div class="moving-object kunai k1"></div>
    <div class="moving-object fan u2"></div>
    <div class="moving-object shuriken s2"></div>
    <div class="moving-object kunai k2"></div>
    <div class="moving-object sharingan-eye tomoe1"></div>
    <div class="moving-object sharingan-eye tomoe2"></div>

    <div class="police-lights"></div>

    <main class="main-container">
        <header>
            <img src="assets/logo4.png" alt="Logo da Polícia Uchiha" class="police-logo"/>
            <h1>Regras de Votação</h1>
            <p class="subtitle">Departamento de Polícia de Konoha</p>
        </header>

        <section class="form-section">
            <div class="input-group">
                <label for="anoNascimento">Ano de nascimento:</label>
                <input type="number" id="anoNascimento" placeholder="Ex: 1990" autocomplete="off">
                <span class="input-highlight"></span>
            </div>

            <button id="btnVerificarVoto">Verificar Regras</button>
        </section>

        <footer>
            <div id="resultadoVoto"></div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
