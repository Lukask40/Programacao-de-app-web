<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expansão de Domínio: Média Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="hollow-purple-orb"></div>
    <div class="blue-orb"></div>

    <div class="container">
        <h1 class="titulo-gojo">Expansão de Domínio</h1>
        <p class="subtitulo">Cálculo de Notas Infinitas 🤞</p>

        <div class="input-group">
            <label for="nota1">Primeira Nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Entre 0 e 10">
        </div>

        <div class="input-group">
            <label for="nota2">Segunda Nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Entre 0 e 10">
        </div>

        <div class="input-group">
            <label for="nota3">Terceira Nota:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Entre 0 e 10">
        </div>

        <button type="button" id="btnCalcular">Calcular Média</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
